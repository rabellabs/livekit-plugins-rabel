[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-rabel"
dynamic = ["version"]
description = "Agent Framework plugin for Rabel Bell: an early start for your agent's reply, on a guess at how the turn will end"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "Rabel Labs" }]
keywords = ["voice", "ai", "realtime", "audio", "livekit", "rabel", "bell", "stt", "preemptive generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["livekit-agents>=1.8.13,<2"]

[project.urls]
Documentation = "https://docs.livekit.io"
Website = "https://rabellabs.com/"

[tool.hatch.version]
path = "livekit/plugins/rabel/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]
exclude = ["/lab", "/REPORT.md"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]
exclude = ["/lab", "/REPORT.md"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { livekit-agents = "0 days" }
