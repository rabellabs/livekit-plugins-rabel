# Only for running this repository's tests on their own. Inside LiveKit's agents repository the root pyproject.toml
# holds the same settings and the `unit` marker.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# tests/fork/ runs inside LiveKit's agents repository, on its tests/virtual_time.py
addopts = --ignore=tests/fork
markers =
    unit: fast tests with no external providers
